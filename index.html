<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 8px;
      font-family: Arial, sans-serif;
      background: transparent;
    }

    .reward-box {
      width: 100%;
      padding: 18px;
      border: 2px solid #ffb3cc;
      border-radius: 14px;
      background: #fff1f6;
      text-align: center;
    }

    h2 {
      margin: 0 0 6px;
      font-size: 20px;
    }

    p {
      margin: 0 0 14px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      text-transform: uppercase;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 12px;
      min-height: 18px;
      font-weight: bold;
    }

    .success { color: #16803a; }
    .error { color: #b42318; }
  </style>
</head>

<body>

  <div class="reward-box">

    <h2>💗 Have a Petty Reward?</h2>
    <p>Enter your Petty Reward code below.</p>

    <input
      id="rewardCode"
      type="text"
      placeholder="PETTY-XXXXXX"
      autocomplete="off"
    >

    <button type="button" onclick="applyReward()">
      APPLY REWARD
    </button>

    <div id="message"></div>

  </div>

  <script>

    const VALIDATION_URL =
      "https://script.google.com/macros/s/AKfycbytvNKNhUX8OPhUgi_8r4338o9UxdWw5nrsN-RgyKDjgnngaCRJ5R-H2vY3t6SZ1j-d/exec";

    let validatedReward = "";
    let validatedCode = "";


    function applyReward() {

      const code = document
        .getElementById("rewardCode")
        .value
        .trim()
        .toUpperCase();

      const message =
        document.getElementById("message");

      validatedReward = "";
      validatedCode = "";

      if (!code) {

        message.className = "error";
        message.textContent =
          "Please enter your Petty Reward code.";

        return;
      }

      message.className = "";
      message.textContent = "Checking reward...";


      const url =
        VALIDATION_URL +
        "?action=validateReward" +
        "&code=" +
        encodeURIComponent(code);


      fetch(url)

        .then(function(response) {

          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }

          return response.json();

        })

        .then(function(result) {

          if (!result.valid) {

            message.className = "error";

            message.textContent =
              result.message ||
              "That reward code isn't valid.";

            return;
          }


          /*
           * Keep the widget value numeric.
           * Jotform uses this for the discount calculation.
           */

          validatedReward =
            String(Number(result.amount));

          /*
           * Save the exact validated reward code.
           */

          validatedCode = code;


          message.className = "success";

          message.textContent =
            "🎉 $" +
            Number(result.amount).toFixed(2) +
            " Petty Reward applied!";


          if (window.JFCustomWidget) {

            /*
             * Send the dollar amount as THIS widget's value.
             */

            JFCustomWidget.sendData({
              value: validatedReward
            });


            /*
             * Send the actual reward code to
             * Jotform field #161:
             * Petty Reward Code
             */

            JFCustomWidget.setFieldsValueById([
              {
                id: "161",
                value: validatedCode
              }
            ]);

          }

        })

        .catch(function(error) {

          console.error(error);

          message.className = "error";

          message.textContent =
            "We couldn't check your reward right now.";

        });

    }


    if (window.JFCustomWidget) {

      JFCustomWidget.subscribe(
        "ready",
        function() {

          JFCustomWidget.subscribe(
            "submit",
            function() {

              JFCustomWidget.sendSubmit({
                valid: true,
                value: validatedReward
              });

            }
          );

        }
      );

    }

  </script>

</body>
</html>
